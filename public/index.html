<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161B33">
<title>마피아 온라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 참가자: 폰 한 손 화면(단일 열). 사회자: 넓은 화면에서 좌(진행)/우(명단·기록). */
:root{
  --bg:#E8ECF1; --surface:#FFFFFF; --surface-2:#F2F4F8; --ink:#141820; --muted:#5A6373; --line:#D1D7E0;
  --mafia:#B42318; --mafia-soft:#FBE6E3; --on-mafia:#FFFFFF;
  --citizen:#1F57C3; --citizen-soft:#E2EBFB; --on-citizen:#FFFFFF;
  --ok:#1D7A4C; --ok-soft:#DFF3E8;
  --night:#161B33; --night-ink:#E7EAF7; --night-muted:#98A1C6; --moon:#F1E2A0;
  --day:#F5C452; --day-ink:#2A1D00; --focus:#1F57C3;
  --f-display:"Black Han Sans","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1117; --surface:#161A22; --surface-2:#1C212B; --ink:#E8EBF1; --muted:#98A1B0; --line:#2A303B;
  --mafia:#F0645A; --mafia-soft:#3A1714; --on-mafia:#1A0604;
  --citizen:#7EA4FF; --citizen-soft:#15223D; --on-citizen:#06112A;
  --ok:#4CC38A; --ok-soft:#12291D;
  --night:#0A0D1E; --night-ink:#E2E6F7; --night-muted:#8890B5; --moon:#E9D88F;
  --day:#D9A83A; --day-ink:#1D1400; --focus:#7EA4FF; color-scheme:dark;
}}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto}
.wrap.host{max-width:1140px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 10px;
  display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;letter-spacing:.5px}
.brand h1 b{font-weight:400;color:var(--mafia)}
.who{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.host{background:var(--ink);color:var(--bg)}
.chip.code{font-family:var(--f-mono);letter-spacing:.12em}
.chip .lv{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.demobar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--citizen-soft);color:var(--citizen);font-size:14px;font-weight:600;margin-bottom:14px}
.demobar select{font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}

.stack{display:flex;flex-direction:column;gap:14px}
.hgrid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.hgrid{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.3px}
.hint{color:var(--muted);font-size:13.5px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}

.btn{text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{background:var(--mafia);color:var(--on-mafia);border-color:var(--mafia)}
.btn.blue{background:var(--citizen);color:var(--on-citizen);border-color:var(--citizen)}
.btn.big{font-size:17px;padding:14px 22px;min-height:54px}
.btn.wide{width:100%}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
input[type=text]{width:100%;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
input.codein{font-family:var(--f-mono);letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:26px;font-weight:600}

.landing{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.landing{grid-template-columns:1fr 1fr}}
.hero{border-radius:16px;background:var(--night);color:var(--night-ink);padding:28px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;
  background-image:radial-gradient(1.5px 1.5px at 72% 28%,var(--night-muted) 99%,transparent),radial-gradient(1px 1px at 84% 64%,var(--night-muted) 99%,transparent),radial-gradient(1.5px 1.5px at 92% 20%,var(--night-muted) 99%,transparent),radial-gradient(1px 1px at 60% 75%,var(--night-muted) 99%,transparent)}
.hero .moonbig{position:absolute;right:26px;top:22px;width:60px;height:60px;border-radius:50%;box-shadow:16px -4px 0 0 var(--moon)}
.hero h2{font-size:40px;line-height:1.05}
.hero h2 b{color:#F0645A;font-weight:400}
.hero p{margin-top:10px;max-width:34ch;opacity:.9}

.band{border-radius:14px;padding:16px 18px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.band.night{background:var(--night);color:var(--night-ink)}
.band.night::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;
  background-image:radial-gradient(1.5px 1.5px at 72% 28%,var(--night-muted) 99%,transparent),radial-gradient(1px 1px at 84% 64%,var(--night-muted) 99%,transparent),radial-gradient(1.5px 1.5px at 92% 20%,var(--night-muted) 99%,transparent),radial-gradient(1px 1px at 60% 75%,var(--night-muted) 99%,transparent)}
.band.day{background:var(--day);color:var(--day-ink)}
.band.lobby{background:var(--surface);border:1px solid var(--line)}
.band.win-mafia{background:var(--mafia);color:var(--on-mafia)}
.band.win-citizen{background:var(--citizen);color:var(--on-citizen)}
.band .bt{flex:1;min-width:0}
.band h2{font-size:28px;line-height:1.05}
.band .sub{font-size:14px;font-weight:600;opacity:.82;margin-top:3px}
.band .clock{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;position:relative;z-index:1}
.band .clock.low{color:var(--mafia)}
.band.night .clock.low{color:var(--moon)}
.icon{flex:none;width:42px;height:42px;position:relative}
.moon::before{content:"";position:absolute;width:32px;height:32px;border-radius:50%;left:0;top:4px;box-shadow:9px -2px 0 0 var(--moon)}
.sun::before{content:"";position:absolute;inset:5px;border-radius:50%;border:3px solid var(--day-ink);background:radial-gradient(circle,var(--day-ink) 0 38%,transparent 40%)}
.flag::before{content:"";position:absolute;inset:7px;border-radius:50%;border:3px solid currentColor}
.door::before{content:"";position:absolute;inset:4px 9px 2px;border:3px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0}

.announce{padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:18px;font-weight:600;line-height:1.5}

.rolecard{border-radius:14px;border:2px dashed var(--line);background:var(--surface-2);padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%}
.rolecard .rc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rolecard .rc-name{font-family:var(--f-display);font-size:22px}
.rolecard.open{border-style:solid;cursor:default}
.rolecard.open.t-mafia{background:var(--mafia);border-color:var(--mafia);color:var(--on-mafia)}
.rolecard.open.t-citizen{background:var(--citizen);border-color:var(--citizen);color:var(--on-citizen)}
.rolecard.open .rc-name{font-size:48px;line-height:1}
.rolecard .rc-desc{font-size:15px;opacity:.94}
.rolecard .rc-box{padding:8px 12px;border-radius:8px;background:color-mix(in srgb,currentColor 14%,transparent);font-size:14px;font-weight:600}
.rolecard .rc-box ul{margin:4px 0 0;padding-left:18px}
.rolecard .btn{background:transparent;border-color:currentColor;color:inherit;align-self:flex-start}

.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.pick{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:56px;min-width:0}
.pick .s{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pick b{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick[aria-pressed="true"] .s{color:inherit;opacity:.7}
.pick:disabled{opacity:.5;cursor:not-allowed}
.okline{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ok)}
.okline::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}

.tally{display:flex;flex-direction:column;gap:8px}
.tr{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;font-size:14px}
.tr .bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.tr .bar i{display:block;height:100%;background:var(--ink)}
.tr.top .bar i{background:var(--mafia)}
.tr .who{font-size:12.5px;color:var(--muted);grid-column:1/-1;margin-top:-4px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn .btn{min-height:64px;font-size:19px}
.yn .btn[aria-pressed="true"].danger{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--mafia)}
.yn .btn[aria-pressed="true"].blue{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--citizen)}
.meter{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;font-size:14px}
.meter b{font-family:var(--f-mono);font-size:24px}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.pc{border:1px solid var(--line);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;gap:3px;background:var(--surface);min-width:0}
.pc .top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:20px}
.pc .s{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pc b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .x{font-size:11px;font-weight:700;color:var(--muted)}
.pc.me{border-color:var(--ink)}
.pc.dead{background:var(--surface-2);border-style:dashed}
.pc.dead b{text-decoration:line-through;color:var(--muted)}
.pc .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 2px;min-height:20px}
.rt{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;background:var(--citizen-soft);color:var(--citizen)}
.rt.mafia{background:var(--mafia-soft);color:var(--mafia)}
.rt.plain{background:var(--surface-2);color:var(--muted)}
.hidesec .secret{filter:blur(6px);user-select:none}

.invite{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:520px){.invite{grid-template-columns:1fr}}
.qr{width:148px;height:148px;background:#fff;border-radius:10px;padding:8px;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{width:132px!important;height:132px!important}
.bigcode{font-family:var(--f-mono);font-size:44px;font-weight:600;letter-spacing:.18em;line-height:1}
.linkrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.linkrow code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:6px 8px;border-radius:6px;overflow-wrap:anywhere;flex:1;min-width:0;user-select:all}

.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 6px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px}
.seg button small{font-weight:500;font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.75}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rinfo{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.rdesc{color:var(--muted);font-size:13px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:18px;line-height:1}
.step button:disabled{opacity:.4;cursor:not-allowed}
.step b,.auto b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:26px;text-align:center;font-size:16px}
.auto{display:flex;align-items:center;gap:6px;padding-right:4px}
.auto small{color:var(--muted);font-size:12px}
.compbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px;gap:2px}
.compbar .m{background:var(--mafia)} .compbar .c{background:var(--citizen)}
.complegend{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;font-weight:600}
.complegend .m{color:var(--mafia)} .complegend .c{color:var(--citizen)}
.switch{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--ink)}
.warn{margin:10px 0 0;padding:10px 12px 10px 28px;border-radius:8px;background:var(--mafia-soft);color:var(--mafia);font-size:13.5px;font-weight:600}
.note{padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:14px}

.timeset{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.timeset{grid-template-columns:1fr}}
.tfield{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.tin{display:flex;align-items:baseline;gap:6px}
.tin input{width:5ch;font-family:var(--f-mono);font-size:28px;font-weight:600;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--ink);padding:0 2px}
.tin input:focus{outline:none;border-bottom-color:var(--focus)}
.tin b{font-weight:600;color:var(--muted)}
.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pr{display:flex;flex-direction:column;gap:2px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);font-size:13.5px;min-width:0}
.pr .top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.pr b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .tg{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr.done{border-color:var(--ok);background:var(--ok-soft)}
.pr.key{border-width:2px}
.ctl{display:flex;flex-direction:column;gap:12px}
.timerctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ink);width:0}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:320px;overflow:auto}
.log li{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .lt{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
details.fold>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-size:18px}
details.fold[open]>summary::after{content:"−"}
details.fold>summary::-webkit-details-marker{display:none}
details.fold[open]>summary{margin-bottom:10px}
ul.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.rcd{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.rcd h3{font-family:var(--f-display);font-weight:400;font-size:18px}
.rcd.mafia h3{color:var(--mafia)} .rcd.citizen h3{color:var(--citizen)}
.empty{text-align:center;padding:40px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty p{max-width:44ch;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="config.js"></script>
<script type="module">
/* ============================================================
   마피아 온라인 — 6~20명, 사회자 1명
   데이터: Firebase(익명 로그인 + Firestore) 또는 데모 모드(이 기기 메모리)
   ============================================================ */
const MAX=20, MIN=6, FB_VER='10.12.2';
const ROLES={
  mafia:{name:'마피아',team:'mafia',brief:'밤마다 한 명 제거',desc:'밤마다 제거할 사람을 고릅니다. 동료 마피아의 선택이 아래에 보입니다. 표가 갈리면 가장 많이 고른 사람, 동률이면 그중 무작위로 정해집니다.'},
  police:{name:'경찰',team:'citizen',brief:'밤마다 한 명 조사',desc:'밤마다 한 명을 조사합니다. 고르는 즉시 결과가 이 카드에 나타나고, 그날 밤에는 바꿀 수 없습니다.'},

function presetCounts(p,n){
  n=Math.max(n,MIN);
  const std=Math.max(1,Math.round(n*0.24));
  let m=p==='intro'?Math.max(1,std-1):p==='hard'?std+1:std;
  while(m>1&&m*2>=n)m--;
  return {mafia:m,police:1,doctor:1,soldier:p!=='intro'&&n>=10?1:0,politician:p!=='intro'&&n>=12?1:0};
}

function makeLocal(){
  const store=new Map(),docL=new Map(),colL=new Map();
  const parent=p=>p.split('/').slice(0,-1).join('/');
  const colData=c=>{const o={};for(const[p,d]of store)if(parent(p)===c)o[p.split('/').pop()]=cl(d);return o};
  const emit=p=>queueMicrotask(()=>{(docL.get(p)||[]).forEach(cb=>cb(store.has(p)?cl(store.get(p)):null));const c=parent(p);(colL.get(c)||[]).forEach(cb=>cb(colData(c)))});
  const sub=(m,k,cb,first)=>{const s=m.get(k)||new Set();s.add(cb);m.set(k,s);queueMicrotask(()=>cb(first()));return()=>s.delete(cb)};
  return {mode:'demo',uid:'demo-host',
    onDoc:(p,cb)=>sub(docL,p,cb,()=>store.has(p)?cl(store.get(p)):null),
    onCol:(c,cb)=>sub(colL,c,cb,()=>colData(c)),
    get:async p=>store.has(p)?cl(store.get(p)):null,
    set:async(p,d)=>{store.set(p,cl(d));emit(p)},
    update:async(p,d)=>{if(!store.has(p))throw{code:'not-found'};store.set(p,{...store.get(p),...cl(d)});emit(p)},
    del:async p=>{store.delete(p);emit(p)}};
}
async function makeFirebase(cfg){
  const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [A,Au,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(cfg),auth=Au.getAuth(app),db=F.getFirestore(app);
  const uid=await new Promise((res,rej)=>{let tried=false;const un=Au.onAuthStateChanged(auth,u=>{if(u){un();res(u.uid)}else if(!tried){tried=true;Au.signInAnonymously(auth).catch(rej)}},rej)});
  return {mode:'live',uid,
    onDoc:(p,cb,err)=>F.onSnapshot(F.doc(db,p),s=>cb(s.exists()?s.data():null),err),
    onCol:(p,cb,err)=>F.onSnapshot(F.collection(db,p),s=>{const o={};s.forEach(d=>o[d.id]=d.data());cb(o)},err),
    get:async p=>{const s=await F.getDoc(F.doc(db,p));return s.exists()?s.data():null},
    set:(p,d)=>F.setDoc(F.doc(db,p),d),
    update:(p,d)=>F.updateDoc(F.doc(db,p),d),
    del:p=>F.deleteDoc(F.doc(db,p))};
}

function winnerOf(alive,R){let m=0,c=0;for(const id in alive){if(!alive[id])continue;R[id]==='mafia'?m++:c++}return m===0?'citizen':m>=c?'mafia':null}

function problems(n){
  const p=[],c=comp(n);
  if(n<MIN)p.push(`최소 ${MIN}명이 필요합니다. 지금 ${n}명입니다.`);
  if(n>MAX)p.push(`최대 ${MAX}명까지입니다. 지금 ${n}명입니다.`);
  if(c.mafia<1)p.push('마피아는 1명 이상이어야 합니다.');
  if(n-specials(c)<0)p.push(`직업 수가 인원보다 ${specials(c)-n}개 많습니다.`);
  else if(n>=MIN&&c.mafia*2>=n)p.push('마피아가 전체의 절반 이상이면 시작하자마자 마피아가 이깁니다.');
  return p;
}

function pushLog(log,t,text){return [{t,text},...(log||[])].slice(0,80)}

    let target=null;

function dayTally(weighted){

  al.forEach(id=>{const v=VO[id];if(v&&v.key===key&&G0.alive[v.target]&&v.target!==id)(by[v.target]=by[v.target]||[]).push(id)});
  const rows=Object.entries(by).map(([t,vs])=>[t,vs,vs.reduce((a,v)=>a+wt(v),0)]).sort((a,b)=>b[2]-a[2]),mx=rows.length?rows[0][2]:0;
  return {rows,mx,tops:rows.filter(r=>r[2]===mx).map(r=>r[0]),voted:rows.reduce((a,r)=>a+r[1].length,0),al};
}

async function clearBots(){ui.busy='테스트 참가자 정리 중';render();try{for(const id of joinedIds().filter(id=>PL[id].bot))await delDoc(R_('players/'+id))}catch(e){fail(e)}ui.busy='';render()}
const isBot=id=>(PL[id]&&PL[id].bot)||String(id).startsWith('bot-');
async function botAct(){
  const G0=g(),R=SEC?SEC.roles:{},al=aliveIds(),bots=al.filter(isBot);
  if(!bots.length){toast('살아 있는 테스트 참가자가 없습니다.');return}
  ui.busy='테스트 참가자 행동 입력 중';render();
  try{
    if(G0.phase==='night'){
      const key=nk(),mt=rnd(al.filter(id=>R[id]!=='mafia'));
      for(const id of bots){const others=al.filter(x=>x!==id);let t;
        if(R[id]==='mafia')t=mt;else if(R[id]==='doctor')t=rnd(al);else t=rnd(others);
        if(t){ACTS={...ACTS,[id]:{key,target:t}};await setDoc(R_('actions/'+id),{key,target:t})}}
    }else if(G0.phase==='day'){
      const key=vk(),sus=rnd(al);
      for(const id of bots){const others=al.filter(x=>x!==id);const t=Math.random()<.7&&sus!==id?sus:rnd(others);VO={...VO,[id]:{key,target:t}};await setDoc(R_('votes/'+id),{key,target:t})}
    }
  }catch(e){fail(e)}
  ui.busy='';hostSync();render();
}

/* ---------- 공용 화면 조각 ---------- */
function remain(){const G0=g();if(G0.paused!=null)return G0.paused;if(G0.deadline)return G0.deadline-Date.now();return null}
function band(){
  const G0=g(),r=remain(),clock=r==null?'':`<span class="clock" data-clock>${fmt(r)}</span>`;
  if(G0.phase==='lobby')return `<div class="band lobby"><span class="icon door"></span><div class="bt"><h2>입장 대기</h2><div class="sub">게임 ${G0.gameNo} · ${joinedIds().length}/${MAX}명 입장</div></div></div>`;
  if(G0.phase==='night')return `<div class="band night"><span class="icon moon"></span><div class="bt"><h2>${G0.round}번째 밤</h2><div class="sub">마피아·능력자가 행동하는 시간${G0.paused!=null?' · 일시정지':''}</div></div>${clock}</div>`;
  if(G0.phase==='end')return `<div class="band win-${G0.winner}"><span class="icon flag"></span><div class="bt"><h2>${G0.winner==='mafia'?'마피아 팀 승리':'시민 팀 승리'}</h2><div class="sub">게임 ${G0.gameNo} · ${G0.round}라운드에서 끝남</div></div></div>`;
  const sub='토론 · 탈락 투표';
  return `<div class="band day"><span class="icon sun"></span><div class="bt"><h2>${G0.round}번째 낮</h2><div class="sub">${sub}${G0.paused!=null?' · 일시정지':''}</div></div>${clock}</div>`;
}
function tallyHTML(host){
  const {rows,voted,al}=dayTally(false);const mx=rows.length?rows[0][2]:0;
  let lead='';
  if(host&&SEC){const w=dayTally(true);lead=!w.rows.length?'':`<span class="hint secret">${w.tops.length>1?'지금 마감하면 동률이라 탈락 없음':`지금 마감하면 ${esc(nameOf(w.tops[0]))}님 탈락`} (정치인 2표 반영)</span>`}
  return `<div class="meter" style="margin-bottom:10px"><span>투표 <b>${voted}</b>/${al.length}</span>${lead}</div>${rows.length?`<div class="tally">${rows.map(([t,vs,n])=>`<div class="tr ${n===mx?'top':''}"><b>${esc(nameOf(t))}</b><div class="bar"><i style="width:${n/al.length*100}%"></i></div><span class="num">${n}표</span><span class="who">${vs.map(v=>esc(nameOf(v))).join(', ')}</span></div>`).join('')}</div>`:'<p class="hint">아직 투표한 사람이 없습니다.</p>'}${host?'':'<p class="hint" style="margin-top:10px">정치인의 표는 마감할 때 2표로 계산되므로 실제 결과는 이 집계와 다를 수 있습니다.</p>'}`;
}
function boardHTML(opts){
  const G0=g(),host=opts&&opts.host,R=host&&SEC?SEC.roles:(G0.reveal||{});
  const ids=inGame()?G0.order:joinedIds();
  if(!ids.length)return '<p class="hint">아직 아무도 들어오지 않았습니다.</p>';
  return `<div class="board">${ids.map((id,i)=>{
    const dead=inGame()&&!G0.alive[id],role=R[id]||(G0.deadRoles||{})[id];const fl=[];

    if(host&&SEC&&R[id]==='soldier'&&SEC.armor&&SEC.armor[id]===false)fl.push('<span class="x secret">방탄 소진</span>');
    if(isBot(id))fl.push('<span class="x">테스트</span>');
    const showRole=role&&(host||G0.reveal||(G0.deadRoles||{})[id]);

    return `<div class="pc ${dead?'dead':''} ${id===ME()?'me':''}"><div class="top"><span class="s">${pad(i+1)}${id===ME()?' · 나':''}</span>${showRole?`<span class="rt ${cls(role)} ${host&&!G0.reveal?'secret':''}">${ROLES[role].name}</span>`:rm}</div><b title="${esc(nameOf(id))}">${esc(nameOf(id))}</b>${fl.length?`<div>${fl.join(' ')}</div>`:''}</div>`}).join('')}</div>`;
}
function rulesHTML(){
  return `<details class="panel fold"><summary><h2>규칙</h2></summary><div class="stack">
  <ul class="list"><li><b>시민 팀</b>은 마피아를 모두 처형하면 이깁니다. <b>마피아 팀</b>은 살아 있는 마피아 수가 나머지와 같아지면 이깁니다.</li>
  <li>게임은 <b>낮부터</b> 시작합니다. 낮 → 밤 → 낮 순서로 반복합니다.</li>
  <li>밤(기본 20분)에는 마피아가 함께 탈락시킬 사람을 고르고, 경찰은 조사, 의사는 보호를 합니다. 군인은 공격을 한 번 자동으로 버팁니다. 다른 직업도 화면에서 한 명을 고르지만 의심 메모일 뿐입니다.</li>
  <li>낮(기본 40분)에는 토론하면서 탈락시킬 사람에게 투표합니다. 낮이 끝나면 최다 득표자가 바로 탈락하고, 동률이면 아무도 탈락하지 않습니다. 정치인의 표는 마감할 때 2표로 계산됩니다.</li>
  <li>죽은 사람은 말하지 않고 표정으로도 힌트를 주지 않습니다. 내 화면을 남에게 보여 주는 것도 금지입니다.</li></ul>
  <div class="cards">${ORDER.map(k=>`<div class="rcd ${ROLES[k].team}"><h3>${ROLES[k].name}</h3><span class="label">${ROLES[k].team==='mafia'?'마피아 팀':'시민 팀'} · ${ROLES[k].brief}</span></div>`).join('')}</div>
  <p class="hint">점수: 이긴 팀 +2점, 이긴 팀 생존자 +1점, 판별 MVP +1점.</p>
  <a class="btn sm" style="align-self:flex-start" href="rules.html" target="_blank" rel="noopener">전체 룰북 열기</a></div></details>`;
}
function scoreHTML(open){
  const rows=SC&&SC.rows?Object.entries(SC.rows).map(([id,r])=>({id,...r})).sort((a,b)=>b.pts-a.pts||b.wins-a.wins||a.name.localeCompare(b.name,'ko')):[];
  let rank=0,prev=null;
  const body=rows.map((r,i)=>{if(!prev||prev.pts!==r.pts||prev.wins!==r.wins)rank=i+1;prev=r;return `<tr><td class="n">${rank}위</td><td>${esc(r.name)}${r.id===ME()?' (나)':''}</td><td class="n">${r.pts}</td><td class="n">${r.wins}/${r.games}</td><td class="n">${r.mvp||0}</td></tr>`}).join('');
  return `<details class="panel fold" ${open?'open':''}><summary><h2>점수판</h2></summary>${rows.length?`<div class="tbl"><table><thead><tr><th>순위</th><th>이름</th><th>점수</th><th>승/판</th><th>MVP</th></tr></thead><tbody>${body}</tbody></table></div>`:'<p class="hint">게임이 끝나고 사회자가 반영하면 여기에 쌓입니다.</p>'}</details>`;
}
function logHTML(){const L=g().log||[];return `<section class="panel"><div class="ph"><h2>기록</h2><span class="hint">최근 순</span></div>${L.length?`<ol class="log">${L.map(e=>`<li><span class="lt">${esc(e.t)}</span><span>${esc(e.text)}</span></li>`).join('')}</ol>`:'<p class="hint">게임이 시작되면 공개된 사건이 쌓입니다.</p>'}</section>`}
function picks(list,selected,act,opts){

function playerAction(){
  const G0=g(),ph=G0.phase,me=ME(),inThis=G0.order.includes(me),alive=inThis&&G0.alive[me];
  if(ph==='lobby')return `<section class="panel"><div class="ph"><h2>입장 완료</h2><span class="num">${joinedIds().length}/${MAX}명</span></div><p class="hint">사회자가 게임을 시작하면 이 화면에 내 직업이 나타납니다. 화면을 켜 두세요.</p><div class="btns" style="margin-top:12px"><button class="btn sm ghost" data-act="leave">나가기</button></div></section>`;
  if(!inThis)return `<section class="panel"><h2>관전 중</h2><p class="hint" style="margin-top:6px">이번 게임이 시작된 뒤에 들어왔습니다. 다음 게임부터 직업을 받습니다.</p></section>`;
  if(ph==='end')return '';
  if(!alive)return `<section class="panel"><h2>관전 중</h2><p class="hint" style="margin-top:6px">당신은 탈락했습니다. 말하거나 표정으로 힌트를 주지 말아 주세요. 게임은 끝까지 지켜볼 수 있습니다.</p></section>${ph==='day'?`<section class="panel"><div class="ph"><h2>실시간 집계</h2></div>${tallyHTML()}</section>`:''}`;
  if(ph==='night'){
    const r=MYROLE&&MYROLE.gameNo===G0.gameNo?MYROLE.role:null,key=nk(),sel=MYACT&&MYACT.key===key?MYACT.target:null;
    const locked=r==='police'&&(MYROLE.checks||[]).some(c=>c.round===G0.round);
    let list=aliveIds().filter(id=>id!==me);
    if(r==='doctor')list=aliveIds();

    return `<section class="panel"><div class="ph"><h2>한 명을 고르세요</h2>${sel?'<span class="okline">제출됨</span>':''}</div>
    <p class="hint" style="margin-bottom:10px">무엇을 고르는지는 내 직업 카드에 적혀 있습니다. ${locked?'오늘 밤 조사는 끝났습니다.':'밤이 끝나기 전까지 바꿀 수 있습니다.'}</p>${picks(list,sel,'night',{disabled:locked})}</section>`;

  }

function revealHTML(){

function vPlayer(){
  const G0=g(),joined=PL[ME()];
  const parts=[band()];
  if(G0.announce&&['night','day','end'].includes(G0.phase))parts.push(`<div class="announce">${esc(G0.announce)}</div>`);

let qrLib=null,qrFor='';

  const e=err=>{console.error(err);toast('실시간 연결에 문제가 생겼습니다. 새로고침해 주세요.')};

    const r=await D.get(`rooms/${c}`).catch(()=>null);if(!r){toast(`${c} 방을 찾지 못했습니다. 코드를 확인해 주세요.`);return}enterRoom(c);return}
  if(e.target.id==='joinform'){
    const name=ui.draft.trim().slice(0,12);if(!name){toast('이름을 입력해 주세요.');return}
    if(joinedIds().length>=MAX){toast(`최대 ${MAX}명까지 들어올 수 있습니다.`);return}
    if(joinedIds().some(id=>id!==ME()&&PL[id].name===name)){toast('같은 이름이 이미 있습니다. 성이나 숫자를 붙여 주세요.');return}
    try{localStorage.setItem('mafia-name',name)}catch(err){}
    const me=ME();PL={...PL,[me]:{name,joinedAt:Date.now()}};render();
    try{await setDoc(R_('players/'+me),{name,joinedAt:Date.now()})}catch(err){const c={...PL};delete c[me];PL=c;fail(err);render()}
  }
});

/* ---------- 시작 ---------- */
async function boot(){
  render();
  const cfg=window.FIREBASE_CONFIG;
  try{D=cfg&&cfg.apiKey?await makeFirebase(cfg):makeLocal()}
  catch(e){console.error(e);BOOTERR='Firebase에 연결하지 못했습니다. config.js 설정과 인터넷 연결, 익명 로그인 사용 설정을 확인해 주세요.';render();return}
  UID=D.uid;VIEW=UID;BOOTED=true;
  const code=new URLSearchParams(location.search).get('room');
  if(code&&D.mode==='live'){ui.code=code.toUpperCase();enterRoom(code.toUpperCase())}else render();
}
boot();
window.__mafia={get state(){return {G,PL,VO,SEC,ACTS,MYROLE,MYACT,VIEW,UID,ROOM}}};
</script>
</body>
</html>
